name: Continuous Integration

on: [push, pull_request]

defaults:
  run:
    working-directory: rust/avida-native

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust/avida-native
    - name: Format
      run: cargo fmt --all --check
    - name: Lint (simulation, analysis and terminal interface)
      run: cargo clippy --workspace --exclude avida-gui --all-targets -- -D warnings
    - name: Test (simulation, analysis and terminal interface)
      run: cargo test --workspace --exclude avida-gui --release

  gui:
    # The desktop application needs windowing libraries; kept apart so a
    # missing system package does not hide a failure of the simulation.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust/avida-native
    - name: Install windowing libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
    - name: Lint and test the desktop application
      run: |
        cargo clippy -p avida-gui --all-targets -- -D warnings
        cargo test -p avida-gui
