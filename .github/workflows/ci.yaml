name: Continuous Integration

on: [push, pull_request]

defaults:
  run:
    working-directory: rust/avida-native

jobs:
  tests:
    # On macOS arm64, the platform of the C++ reference build: tests pin
    # values to the last bit, and the math library of Linux x86-64 differs
    # from it there (a normal deviate in the last bit, the sign of a NaN).
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.99.0
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust/avida-native
    - name: Format
      run: cargo fmt --all --check
    - name: Lint (simulation, analysis and terminal interface)
      run: cargo clippy --workspace --exclude avida-gui --all-targets -- -D warnings
    - name: Test (simulation, analysis and terminal interface)
      run: cargo test --workspace --exclude avida-gui --release
    - name: Consistency suite
      # Against a snapshot of what the C++ reference binary (tag cpp-final)
      # wrote, made on macOS arm64 (tools/suite_ref.py).
      env:
        SUITE_EXPECT: same=85,trivial=34,UNSUPPORTED=1,REF-TIMEOUT=1
        SUITE_JOBS: 3
      run: |
        cargo build --release -p avida
        python3 tools/suite_ref.py unpack
        python3 tools/run_suite.py | tee target/suite/result.txt
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: suite-result
        path: rust/avida-native/target/suite/result.txt

  gui:
    # The desktop application needs windowing libraries; kept apart so a
    # missing system package does not hide a failure of the simulation.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.99.0
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust/avida-native
    - name: Install windowing libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
    - name: Lint and test the desktop application
      run: |
        cargo clippy -p avida-gui --all-targets -- -D warnings
        cargo test -p avida-gui
