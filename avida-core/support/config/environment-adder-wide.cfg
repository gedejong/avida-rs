##############################################################################
#
# Wider adders (port-only extension, opt-in; PORTING.md, "Tasks the C++ does
# not have"; ARCHITECTURE.md, "field_arith"). Three reactions in width order,
# each on its own depletable resource and each worth merit once per organism
# (requisite:max_count=1):
#
#   ADD2  value 7  fn=add:bits=2:mode=packed  ten 2-bit adders in 3-bit fields
#   ADD3  value 8  fn=add:bits=3:mode=packed  eight 3-bit adders in 4-bit fields
#   ADD4  value 9  fn=add:bits=4:mode=packed  six 4-bit adders in 5-bit fields
#
# The values continue those of adder-ladder (ADD2 is rung 6 there, value 7),
# so a population that starts from an organism that solves ADD2 sees the next
# two rungs above it. The fields have the default stride, bits + 1, so a sum
# never carries into the next field: the three result bits of an ADD2 sum, the
# four of ADD3, the five of ADD4 all sit in the field of their operands.
#
# thresh=1: the task pays only for an output with every compared bit right
# (quality q = max(0, 2f - 1) for the fraction f of the bits that are right,
# so q = 1 means f = 1). The partial credit of the ladder (thresh=0.75) is
# off here: a wider adder is either complete or not paid. A process multiplies what it
# consumes by q: consumed = q * min(frac * resource in the cell, max), and the
# merit changes by 2^(value * consumed) (type=pow).
#
# Resources: one grid resource per reaction over the whole 60 x 60 world, with
# the same settings as environment-adder-ladder.cfg: 180 units per update
# spread over 3600 cells is 0.05 a cell, and each cell loses 0.05 of what it
# holds, so an unused cell settles at 1 unit and a task takes half of it. For
# another world size change the coordinates and set inflow to 0.05 times the
# number of cells.
#
# Use with an instruction set without add and sub, so that the arithmetic is a
# composition of nand, shifts and increments (hand-written solutions:
# ladder-add2-*.org, ladder-add3-*.org, ladder-add4-*.org; the carry round
# (x, y) = (x ^ y, (x & y) << 1) is a subroutine in the modular set, written out
# in the stock set).
#
##############################################################################

RESOURCE resADD2:geometry=grid:initial=0:inflow=180:outflow=0.05:inflowx1=0:inflowx2=59:inflowy1=0:inflowy2=59:outflowx1=0:outflowx2=59:outflowy1=0:outflowy2=59:xdiffuse=0.2:ydiffuse=0.2:xgravity=0:ygravity=0
RESOURCE resADD3:geometry=grid:initial=0:inflow=180:outflow=0.05:inflowx1=0:inflowx2=59:inflowy1=0:inflowy2=59:outflowx1=0:outflowx2=59:outflowy1=0:outflowy2=59:xdiffuse=0.2:ydiffuse=0.2:xgravity=0:ygravity=0
RESOURCE resADD4:geometry=grid:initial=0:inflow=180:outflow=0.05:inflowx1=0:inflowx2=59:inflowy1=0:inflowy2=59:outflowx1=0:outflowx2=59:outflowy1=0:outflowy2=59:xdiffuse=0.2:ydiffuse=0.2:xgravity=0:ygravity=0

REACTION ADD2  field_arith:fn=add:bits=2:mode=packed:thresh=1  process:resource=resADD2:value=7.0:type=pow:frac=0.5:max=1.0  requisite:max_count=1
REACTION ADD3  field_arith:fn=add:bits=3:mode=packed:thresh=1  process:resource=resADD3:value=8.0:type=pow:frac=0.5:max=1.0  requisite:max_count=1
REACTION ADD4  field_arith:fn=add:bits=4:mode=packed:thresh=1  process:resource=resADD4:value=9.0:type=pow:frac=0.5:max=1.0  requisite:max_count=1
