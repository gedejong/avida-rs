# Avida experiment file, converted with 'avida convert' from
# avida.cfg, instset-transsmt.cfg, environment.cfg, events.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.
general:
  verbosity: 3
  random_seed: 0
world:
  x: 50
  y: 50
mutation:
  copy_prob: 0.0
  div_prob: 0.000703
  div_ins_prob: 3.906e-5
  div_del_prob: 3.906e-5
  divide_ins_prob: 0.0
  divide_del_prob: 0.0
  inject_prob: 0.0075
  inject_ins_prob: 0.000825
  inject_del_prob: 0.000825
  meta_copy_prob: 0.2
  meta_std_dev: 0.1
reproduction:
  birth_method: 4
  prefer_empty: false
  age_limit: 30
  inherit_merit: false
divide:
  require_single_reaction: 1
parasites:
  inject_method: 1
  virulence: 0.85
  no_copy_mut: true
time:
  merit_inc_apply_immediate: true
  max_cpu_threads: 2
movement:
  vitality_bin_center: 5.0

instruction_sets:
  - name: transsmt
    hardware_type: 2
    instructions:
      - Nop-A
      - Nop-B
      - Nop-C
      - Nop-D
      - Val-Shift-R
      - Val-Shift-L
      - Val-Nand
      - Val-Add
      - Val-Sub
      - Val-Mult
      - Val-Div
      - Val-Mod
      - Val-Inc
      - Val-Dec
      - SetMemory
      - Divide
      - Inst-Read
      - Inst-Write
      - If-Equal
      - If-Not-Equal
      - If-Less
      - If-Greater
      - Head-Push
      - Head-Pop
      - Head-Move
      - Search
      - Push-Next
      - Push-Prev
      - Push-Comp
      - Val-Delete
      - Val-Copy
      - IO
      - Inject
      - Divide-Erase

environment:
  resources:
    - {name: resECHO, inflow: 40, outflow: 0.10}
  reactions:
    - {name: NOT}
    - {name: NAND}
    - {name: AND}
    - {name: ORN}
    - {name: OR}
    - {name: ANDN}
    - {name: NOR}
    - {name: XOR}
    - {name: EQU}
    - name: NOT
      task: not
      process: {resource: resECHO, value: 0.0, type: pow, frac: 0.5, min: 1, max: 1}
      requisite: {noreaction: [EQU, XOR, NOR, ANDN, OR, ORN, AND, NAND, NOT]}
    - name: NAND
      task: nand
      process: {resource: resECHO, value: 0.0, type: pow, frac: 0.5, min: 1, max: 1}
      requisite: {noreaction: [EQU, XOR, NOR, ANDN, OR, ORN, AND, NAND, NOT]}
    - name: AND
      task: and
      process: {resource: resECHO, value: 0.0, type: pow, frac: 0.5, min: 1, max: 1}
      requisite: {noreaction: [EQU, XOR, NOR, ANDN, OR, ORN, AND, NAND, NOT]}
    - name: ORN
      task: orn
      process: {resource: resECHO, value: 0.0, type: pow, frac: 0.5, min: 1, max: 1}
      requisite: {noreaction: [EQU, XOR, NOR, ANDN, OR, ORN, AND, NAND, NOT]}
    - name: OR
      task: or
      process: {resource: resECHO, value: 0.0, type: pow, frac: 0.5, min: 1, max: 1}
      requisite: {noreaction: [EQU, XOR, NOR, ANDN, OR, ORN, AND, NAND, NOT]}
    - name: ANDN
      task: andn
      process: {resource: resECHO, value: 0.0, type: pow, frac: 0.5, min: 1, max: 1}
      requisite: {noreaction: [EQU, XOR, NOR, ANDN, OR, ORN, AND, NAND, NOT]}
    - name: NOR
      task: nor
      process: {resource: resECHO, value: 0.0, type: pow, frac: 0.5, min: 1, max: 1}
      requisite: {noreaction: [EQU, XOR, NOR, ANDN, OR, ORN, AND, NAND, NOT]}
    - name: XOR
      task: xor
      process: {resource: resECHO, value: 0.0, type: pow, frac: 0.5, min: 1, max: 1}
      requisite: {noreaction: [EQU, XOR, NOR, ANDN, OR, ORN, AND, NAND, NOT]}
    - name: EQU
      task: equ
      process: {resource: resECHO, value: 0.0, type: pow, frac: 0.5, min: 1, max: 1}
      requisite: {noreaction: [EQU, XOR, NOR, ANDN, OR, ORN, AND, NAND, NOT]}

events:
  - {at: begin, action: Inject, args: evolved-not.org}
  - {at: 600, action: PrintParasiteData, args: no-parasites.dat}
  - {at: 600, action: DumpParasiteGenotypeGrid, args: no-parasites.grid}
  - {at: 600, action: InjectParasite, args: parasite-smt.org ABB 0 400}
  - {at: 800, action: PrintParasiteData, args: original-parasites.dat}
  - {at: 800, action: DumpParasiteGenotypeGrid, args: original-parasites.grid}
  - {at: 800, action: SavePopulation, args: filename=original}
  - {at: 800, action: KillProb, args: 1.0}
  - {at: 800, action: Inject, args: evolved-not.org}
  - {at: 801, action: PrintParasiteData, args: killed-parasites.dat}
  - {at: 801, action: KillProb, args: 1.0}
  - {at: 801, action: LoadPopulation, args: data/original-800.spop}
  - {at: 802, action: PrintParasiteData, args: reloaded-parasites.dat}
  - {at: 802, action: DumpParasiteGenotypeGrid, args: reloaded-parasites.grid}
  - {at: 802, action: SavePopulation, args: filename=reloaded}
  - {at: 802, action: Exit}
