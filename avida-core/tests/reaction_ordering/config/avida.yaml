# Avida experiment file, converted with 'avida convert' from
# avida.cfg, instset-heads.cfg, environment.cfg, events.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.
general:
  random_seed: 100
world:
  x: 10
  y: 10

instruction_sets:
  - name: instset-heads.cfg
    hardware_type: 0
    instructions:
      - nop-A
      - nop-B
      - nop-C
      - if-n-equ
      - if-less
      - pop
      - push
      - swap-stk
      - swap
      - shift-r
      - shift-l
      - inc
      - dec
      - add
      - sub
      - nand
      - IO
      - h-alloc
      - h-divide
      - h-copy
      - h-search
      - mov-head
      - jmp-head
      - get-head
      - if-label
      - set-flow

environment:
  reactions:
    - {name: ECHO_pre, task: echo, process: {value: 1.0, type: pow}, requisite: {max_count: 1}}
    - {name: ECHO, task: echo, process: {value: 1.0, type: pow}, requisite: {max_count: 1}}
    - {name: NAND, task: nand, process: {value: 1.0, type: pow}, requisite: {max_count: 1}}

events:
  - {at: begin, action: Inject, args: default-classic.org}
  - {at: 0, every: 1, until: end, action: PrintReactionData}
  - {at: 10, action: Exit}
