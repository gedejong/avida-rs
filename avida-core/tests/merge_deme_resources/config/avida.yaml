# Avida experiment file, converted with 'avida convert' from
# avida.cfg, instset-heads.cfg, environment-9demeglobal.cfg, events-merge-deme-resources.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.
general:
  random_seed: 0
world:
  x: 20
  y: 40
  geometry: 1
mutation:
  copy_prob: 0.0
  divide_ins_prob: 0.0
  divide_del_prob: 0.0
reproduction:
  birth_method: 6
parasites:
  infection_mechanism: 0
demes:
  count: 2

instruction_sets:
  - heads_default

environment:
  resources:
    - {name: resNOT, initial: 0.0}
    - {name: resNAND, initial: 0.0}
    - {name: resAND, initial: 0.0}
    - {name: resORN, initial: 0.0}
    - {name: resOR, initial: 0.0}
    - {name: resANDN, initial: 0.0}
    - {name: resNOR, initial: 0.0}
    - {name: resXOR, initial: 0.0}
    - {name: resEQU, initial: 0.0}
    - {name: dResNOT, inflow: 10, outflow: 0.1, deme: true}
    - {name: dResNAND, inflow: 10, outflow: 0.1, deme: true}
    - {name: dResAND, inflow: 10, outflow: 0.1, deme: true}
    - {name: dResORN, inflow: 10, outflow: 0.1, deme: true}
    - {name: dResOR, inflow: 10, outflow: 0.1, deme: true}
    - {name: dResANDN, inflow: 10, outflow: 0.1, deme: true}
    - {name: dResNOR, inflow: 10, outflow: 0.1, deme: true}
    - {name: dResXOR, inflow: 10, outflow: 0.1, deme: true}
    - {name: dResEQU, inflow: 10, outflow: 0.1, deme: true}

events:
  - {at: begin, action: InjectAll, args: filename=default-heads.org}
  - {at: 0, every: 10, until: end, action: PrintResourceData}
  - {at: 0, every: 10, until: end, action: PrintDemeGlobalResources}
  - {at: 0, every: 10, until: end, action: PrintDemeResourceStats}
  - {at: 60, action: MergeResourceAcrossDemes, args: dResNOT resNOT}
  - {at: 70, action: MergeResourceAcrossDemes, args: dResAND resAND}
  - {at: 80, action: MergeResourceAcrossDemes, args: dResOR resOR}
  - {at: 90, action: MergeResourceAcrossDemes, args: dResNOR resNOR}
  - {at: 100, action: MergeResourceAcrossDemes, args: dResEQU resEQU}
  - {at: 200, every: 200, action: SavePopulation}
  - {at: 200, action: Exit}
