# Avida experiment file, converted with 'avida convert' from
# avida.cfg, instset-transsmt.cfg, environment.cfg, events.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.
general:
  verbosity: 3
  random_seed: 353548561
world:
  x: 25
  y: 1000
mutation:
  copy_prob: 0.0
  div_prob: 0.001
  divide_ins_prob: 0.0
  divide_del_prob: 0.0
  inject_prob: 0.005625
reproduction:
  birth_method: 6
  prefer_empty: false
  age_limit: 30
divide:
  min_genome_size: 80
  require_single_reaction: 1
parasites:
  inject_method: 1
  virulence: 0.85
demes:
  migration_file: migration.mat
  count: 40
  use_germline: 1
  reset_resources: 2
  log_replicate: true
  max_births: 0
  germline_ins_mut: 0.0
  germline_del_mut: 0.0
  replicate_orgs: 625
  parasite_migration_rate: 0.002
  migration_method: 4
  partition_interval: 10
  prefer_empty: true
reversion:
  sterilize_unstable: 1
time:
  max_cpu_threads: 2
pheromone:
  log_inject: true

instruction_sets:
  - name: transsmt
    hardware_type: 2
    instructions:
      - Nop-A
      - Nop-B
      - Nop-C
      - Nop-D
      - Val-Shift-R
      - Val-Shift-L
      - Val-Nand
      - Val-Add
      - Val-Sub
      - Val-Mult
      - Val-Div
      - Val-Mod
      - Val-Inc
      - Val-Dec
      - SetMemory
      - Inst-Read
      - Inst-Write
      - If-Equal
      - If-Not-Equal
      - If-Less
      - If-Greater
      - Head-Push
      - Head-Pop
      - Head-Move
      - Search
      - Push-Next
      - Push-Prev
      - Push-Comp
      - Val-Delete
      - Val-Copy
      - IO
      - Inject
      - Divide-Erase

environment:
  resources:
    - {name: resECHO, inflow: 125, outflow: 0.10}
  reactions:
    - name: NAND
      task: nand
      process: {resource: resECHO, value: 0.0, type: add, frac: 1.0, min: 0, max: 1}
      requisite: {reaction_max_count: 1}
    - name: NOT
      task: not
      process: {resource: resECHO, value: 0.0, type: add, frac: 1.0, min: 0, max: 1}
      requisite: {reaction_max_count: 1}
