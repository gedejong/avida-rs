# Avida experiment file, converted with 'avida convert' from
# avida.cfg, environment.cfg, events.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.
general:
  random_seed: 100
world:
  x: 20
  y: 10
mutation:
  copy_prob: 0.0025
  divide_ins_prob: 0.0
  divide_del_prob: 0.0
divide:
  offspring_size_range: 1.0
recombination:
  prob: 0.9
  two_fold_cost_sex: true
time:
  ave_time_slice: 10
  slicing_method: 2
  base_merit_method: 0

instruction_sets:
  - name: instset-heads.cfg
    hardware_type: 0
    instructions:
      - IObuf-add0
      - IObuf-add1
      - {name: repro-sex, redundancy: 0}
      - {name: repro, redundancy: 0}

