# Avida experiment file, converted with 'avida convert' from
# avida.cfg, instset-heads.cfg, environment.cfg, events.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.

instruction_sets:
  - name: instset-heads.cfg
    hardware_type: 0
    instructions:
      - nop-A
      - nop-B
      - nop-C
      - if-n-equ
      - if-less
      - pop
      - push
      - swap-stk
      - swap
      - shift-r
      - shift-l
      - inc
      - dec
      - add
      - sub
      - nand
      - IO
      - h-alloc
      - h-divide
      - h-copy
      - h-search
      - mov-head
      - jmp-head
      - get-head
      - if-label
      - set-flow

environment:
  reactions:
    - name: SORT
      task: sort_inputs
      args: {size: 10, direction: -1, halflife: 2.0}
      process: {value: 1024.0, type: mult}
      requisite: {divide_only: 1}

events:
  - {at: begin, action: Exit}
