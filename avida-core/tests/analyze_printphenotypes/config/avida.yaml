# Avida experiment file, converted with 'avida convert' from
# avida.cfg, instset-classic.cfg, environment.cfg, events.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.
general:
  random_seed: 100

instruction_sets:
  - name: instset-classic.cfg
    hardware_type: 0
    instructions:
      - nop-A
      - nop-B
      - nop-C
      - if-n-equ
      - if-less
      - pop
      - push
      - swap-stk
      - swap
      - shift-r
      - shift-l
      - inc
      - dec
      - add
      - sub
      - nand
      - IO
      - h-alloc
      - h-divide
      - h-copy
      - h-search
      - mov-head
      - jmp-head
      - get-head
      - if-label
      - set-flow

environment:
  resources:
    - {name: resNOT, inflow: 100, outflow: 0.01}
    - {name: resNAND, inflow: 100, outflow: 0.01}
    - {name: resAND, inflow: 100, outflow: 0.01}
    - {name: resORN, inflow: 100, outflow: 0.01}
    - {name: resOR, inflow: 100, outflow: 0.01}
    - {name: resANDN, inflow: 100, outflow: 0.01}
    - {name: resNOR, inflow: 100, outflow: 0.01}
    - {name: resXOR, inflow: 100, outflow: 0.01}
    - {name: resEQU, inflow: 100, outflow: 0.01}
  reactions:
    - name: NOT
      task: not
      process: {resource: resNOT, value: 1.0, type: pow, frac: 0.0025, max: 1}
      requisite: {max_count: 1}
    - name: NAND
      task: nand
      process: {resource: resNAND, value: 1.0, type: pow, frac: 0.0025, max: 1}
      requisite: {max_count: 1}
    - name: AND
      task: and
      process: {resource: resAND, value: 2.0, type: pow, frac: 0.0025, max: 1}
      requisite: {max_count: 1}
    - name: ORN
      task: orn
      process: {resource: resORN, value: 2.0, type: pow, frac: 0.0025, max: 1}
      requisite: {max_count: 1}
    - name: OR
      task: or
      process: {resource: resOR, value: 3.0, type: pow, frac: 0.0025, max: 1}
      requisite: {max_count: 1}
    - name: ANDN
      task: andn
      process: {resource: resANDN, value: 3.0, type: pow, frac: 0.0025, max: 1}
      requisite: {max_count: 1}
    - name: NOR
      task: nor
      process: {resource: resNOR, value: 4.0, type: pow, frac: 0.0025, max: 1}
      requisite: {max_count: 1}
    - name: XOR
      task: xor
      process: {resource: resXOR, value: 4.0, type: pow, frac: 0.0025, max: 1}
      requisite: {max_count: 1}
    - name: EQU
      task: equ
      process: {resource: resEQU, value: 5.0, type: pow, frac: 0.0025, max: 1}
      requisite: {max_count: 1}

events:
  - {at: begin, action: Exit}
