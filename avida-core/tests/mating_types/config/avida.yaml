# Avida experiment file, converted with 'avida convert' from
# avida.cfg, instset-heads-mating-types.cfg, environment.cfg, events.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.
general:
  random_seed: 0
reproduction:
  birth_method: 4
recombination:
  max_birth_wait_time: 3
mating:
  types: 1
  disable_genotype_classification: 1
  assessment_cv: 0.25

instruction_sets:
  - name: heads_sex
    hardware_type: 0
    instructions:
      - nop-A
      - nop-B
      - nop-C
      - if-n-equ
      - if-less
      - if-label
      - mov-head
      - jmp-head
      - get-head
      - set-flow
      - shift-r
      - shift-l
      - inc
      - dec
      - push
      - pop
      - swap-stk
      - swap
      - add
      - sub
      - nand
      - h-copy
      - h-alloc
      - set-mating-type-male
      - set-mating-type-female
      - {name: div-sex-mating-type, female_cost: 5, choosy_female_cost: 5}
      - if-mating-type-juvenile
      - if-mating-type-male
      - if-mating-type-female
      - set-mate-preference-random
      - set-mate-preference-highest-display-a
      - set-mate-preference-highest-merit
      - increment-mating-display-a
      - IO
      - h-search

environment:
  reactions:
    - {name: NOT, task: not, process: {value: 1.0, type: pow}, requisite: {max_count: 1}}
    - {name: NAND, task: nand, process: {value: 1.0, type: pow}, requisite: {max_count: 1}}
    - {name: AND, task: and, process: {value: 2.0, type: pow}, requisite: {max_count: 1}}
    - {name: ORN, task: orn, process: {value: 2.0, type: pow}, requisite: {max_count: 1}}
    - {name: OR, task: or, process: {value: 3.0, type: pow}, requisite: {max_count: 1}}
    - {name: ANDN, task: andn, process: {value: 3.0, type: pow}, requisite: {max_count: 1}}
    - {name: NOR, task: nor, process: {value: 4.0, type: pow}, requisite: {max_count: 1}}
    - {name: XOR, task: xor, process: {value: 4.0, type: pow}, requisite: {max_count: 1}}
    - {name: EQU, task: equ, process: {value: 5.0, type: pow}, requisite: {max_count: 1}}

events:
  - {at: begin, action: InjectRange, args: default-heads-sex-male.org 0 20}
  - {at: begin, action: InjectRange, args: default-heads-sex-male-display-A.org 20 40}
  - {at: begin, action: InjectRange, args: default-heads-sex-female.org 40 50}
  - {at: begin, action: InjectRange, args: default-heads-sex-female-merit-pref.org 50 60}
  - {at: begin, action: InjectRange, args: default-heads-sex-female-display-pref.org 60 70}
  - {at: 0, every: 100, until: end, action: PrintAverageData}
  - {at: 0, every: 100, until: end, action: PrintDominantData}
  - {at: 0, every: 100, until: end, action: PrintCountData}
  - {at: 0, every: 100, until: end, action: PrintTasksData}
  - {at: 0, every: 100, until: end, action: PrintTimeData}
  - {at: 0, every: 100, until: end, action: PrintResourceData}
  - {at: 100, every: 100, until: end, action: PrintMatingTypeHistogram}
  - {at: 100, every: 100, until: end, action: PrintFemaleMatePreferenceData}
  - {at: 100, every: 100, until: end, action: PrintBirthChamberMatingTypeHistogram}
  - {at: 100, every: 100, until: end, action: PrintMatingDisplayData}
  - {at: 100, every: 100, until: end, action: PrintInstructionData}
  - {at: 100, every: 100, until: end, action: PrintInstructionAbundanceHistogram}
  - {at: 200, action: Exit}
