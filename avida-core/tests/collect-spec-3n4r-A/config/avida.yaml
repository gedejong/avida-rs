# Avida experiment file, converted with 'avida convert' from
# avida.cfg, instset-heads-collect.cfg, environment-4resource-noinflow.cfg, events-full-collect-A.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.
general:
  random_seed: 0
parasites:
  infection_mechanism: 0
hoarding:
  use_resource_bins: true
movement:
  vitality_bin_center: 5.0

instruction_sets:
  - name: heads-collect
    hardware_type: 0
    instructions:
      - nop-A
      - nop-B
      - nop-C
      - if-n-equ
      - if-less
      - if-label
      - mov-head
      - jmp-head
      - get-head
      - set-flow
      - shift-r
      - shift-l
      - inc
      - dec
      - push
      - pop
      - swap-stk
      - swap
      - add
      - sub
      - nand
      - h-copy
      - h-alloc
      - h-divide
      - IO
      - h-search
      - collect

environment:
  resources:
    - {name: resNOT, initial: 10000}
    - {name: resNAND, initial: 10000}
    - {name: resAND, initial: 10000}
    - {name: resORN, initial: 10000}

events:
  - {at: begin, action: InjectAll, args: filename=default-heads-collect-A.org}
  - {at: 0, every: 1, until: end, action: PrintResourceData}
  - {at: 2, every: 2, action: SavePopulation}
  - {at: 2, action: Exit}
