# Avida experiment file, converted with 'avida convert' from
# avida.cfg, kitchensink-instset-self.cfg, environment-out.cfg, events-long.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.
general:
  random_seed: 0
mutation:
  copy_prob: 0.0
  divide_ins_prob: 0.0
  divide_del_prob: 0.0
parasites:
  infection_mechanism: 0
demes:
  germline_copy_mut: 0.01
  germline_ins_mut: 0.0
  germline_del_mut: 0.0
movement:
  vitality_bin_center: 5.0

instruction_sets:
  - name: kitchensink-instset-self.cfg
    hardware_type: 0
    instructions:
      - nop-A
      - nop-B
      - nop-C
      - if-n-equ
      - if-less
      - pop
      - push
      - swap-stk
      - swap
      - shift-r
      - shift-l
      - inc
      - dec
      - add
      - sub
      - nand
      - IO
      - h-alloc
      - h-divide
      - h-copy
      - h-search
      - mov-head
      - jmp-head
      - get-head
      - if-label
      - set-flow
      - rotate-left-one
      - rotate-right-one
      - set-opinion
      - get-opinion
      - send-msg
      - retrieve-msg
      - bcast1
      - get-cell-xy
      - get-cycles
      - time
      - nop-X
      - donate-res-to-deme

environment:
  resources:
    - {name: resNOT, deme: true, initial: 100, inflow: 1, outflow: .01}
    - {name: resNAND, deme: true, initial: 100, inflow: 1, outflow: .01}
    - {name: resAND, deme: true, initial: 100, inflow: 1, outflow: .01}
    - {name: resORN, deme: true, initial: 100, inflow: 1, outflow: .01}
    - {name: resOR, deme: true, initial: 100, inflow: 1, outflow: .01}
    - {name: resANDN, deme: true, initial: 100, inflow: 1, outflow: .01}
    - {name: resNOR, deme: true, initial: 100, inflow: 1, outflow: .01}
    - {name: resXOR, deme: true, initial: 100, inflow: 1, outflow: .01}
    - {name: resEQU, deme: true, initial: 100, inflow: 1, outflow: .01}
  reactions:
    - {name: NOT, task: not, process: {resource: resNOT, value: 0.0, frac: 0.05, max: 25}}
    - {name: NAND, task: nand, process: {resource: resNAND, value: 0.0, frac: 0.05, max: 25}}
    - {name: AND, task: and, process: {resource: resAND, value: 0.0, frac: 0.05, max: 25}}
    - {name: ORN, task: orn, process: {resource: resORN, value: 0.0, frac: 0.05, max: 25}}
    - {name: OR, task: or, process: {resource: resOR, value: 0.0, frac: 0.05, max: 25}}
    - {name: ANDN, task: andn, process: {resource: resANDN, value: 0.0, frac: 0.05, max: 25}}
    - {name: NOR, task: nor, process: {resource: resNOR, value: 0.0, frac: 0.05, max: 25}}
    - {name: XOR, task: xor, process: {resource: resXOR, value: 0.0, frac: 0.05, max: 25}}
    - {name: EQU, task: equ, process: {resource: resEQU, value: 0.0, frac: 0.05, max: 25}}

events:
  - {trigger: immediate, action: InjectDemes, args: e_40-588803.org}
  - {at: 0, action: SetEnvironmentInputs, args: 0x0f13149f 0x3308e53e 0x556241eb}
  - {at: 1, every: 1, until: end, action: ReplicateDemes, args: consume-res}
  - {at: 0, every: 1, until: end, action: PrintTasksData}
  - {at: 0, every: 1, until: end, action: PrintReactionData}
  - {at: 0, every: 1, until: end, action: PrintDemeReplicationData}
  - {at: 0, every: 1, until: end, action: PrintDemeReactionDiversityReplicationData}
  - {at: 1, every: 1, until: end, action: ExitDemeReplications, args: 1}
  - {at: 5000, action: exit}
