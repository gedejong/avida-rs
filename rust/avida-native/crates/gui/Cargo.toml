[package]
name = "avida-gui"
version.workspace = true
edition.workspace = true
description = "Desktop front end (eframe/egui) for the native Avida port"

[lints]
workspace = true

[lib]
name = "avida_gui"
path = "src/lib.rs"

[[bin]]
name = "avida-gui"
path = "src/main.rs"

[dependencies]
avida-genome = { path = "../genome" }
avida-session = { path = "../session" }
avida-viewmodel = { path = "../viewmodel" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "persistence", "accesskit"] }
egui = "0.37.0"
egui_extras = "0.37.0"
egui_plot = "0.38.0"
egui_material_icons = "0.9.0"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
rfd = "0.18.0"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu", "snapshot"] }
