# Avida experiment file, converted with 'avida convert' from
# avida.cfg, instset.cfg, environment.cfg, events.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.
general:
  random_seed: 10
world:
  x: 10
  y: 10
mutation:
  copy_prob: 0.0
  divide_ins_prob: 0.0
  divide_del_prob: 0.0
reproduction:
  allow_parent: 0
  death_method: 0
  age_limit: 0
  reset_inputs_on_divide: 1
time:
  ave_time_slice: 10
  slicing_method: 0
  base_merit_method: 0
  merit_inc_apply_immediate: 1
hoarding:
  use_resource_bins: 1
  absorb_resource_fraction: 1.0
  multi_absorb_type: 1
  return_stored_on_death: 0
  split_on_divide: 0
movement:
  use_avatars: 2
  track_birth_locs: 1
sensing:
  look_dist: 50
groups:
  use_form_groups: 1
  pred_prey_switch: 1
  pred_efficiency: 0.37
  pred_efficiency_poison: 0.21
  pred_odds: 0.6
  pred_injury: 0.13
  track_group_attack_details: 1

instruction_sets:
  - name: instset
    hardware_type: 5
    instructions:
      - nop-A
      - nop-B
      - nop-C
      - nop-D
      - nop-E
      - nop-F
      - nop-G
      - nop-H
      - nop-I
      - nop-J
      - nop-K
      - nop-L
      - zero
      - inc
      - dec
      - set-forage-target
      - input
      - output
      - collect-specific
      - rotate-x
      - attack-prey
      - get-faced-org-id
      - attack-ft-prey

environment:
  resources:
    - {name: food, initial: 5000, inflow: 50, outflow: 0.01}
  reactions:
    - {name: ECHO, task: echo, process: {value: 1.0, type: add}, requisite: {max_count: 3}}
    - name: eat0
      task: eat-target
      args: {target_id: 0}
      process: {resource: food, value: 0.5, type: add, min: 1, max: 1, depletable: 1}
    - name: eat1
      task: eat-target
      args: {target_id: 1}
      process: {resource: food, value: 0.5, type: add, min: 1, max: 1, depletable: 1}
    - name: eat2
      task: eat-target
      args: {target_id: 2}
      process: {resource: food, value: 0.5, type: add, min: 1, max: 1, depletable: 1}

events:
  - {at: begin, action: LoadMiniTraceQ, args: file=gq.txt:orgs_per=1}
  - {at: begin, action: Inject, args: g0.org 22}
  - {at: begin, action: Inject, args: g0.org 42}
  - {at: begin, action: Inject, args: g0.org 62}
  - {at: begin, action: Inject, args: g0.org 23}
  - {at: begin, action: Inject, args: g0.org 43}
  - {at: begin, action: Inject, args: g0.org 63}
  - {at: begin, action: Inject, args: g0.org 24}
  - {at: begin, action: Inject, args: g0.org 64}
  - {at: begin, action: Inject, args: g0.org 25}
  - {at: begin, action: Inject, args: g0.org 65}
  - {at: begin, action: Inject, args: g0.org 26}
  - {at: begin, action: Inject, args: g0.org 46}
  - {at: begin, action: Inject, args: g0.org 66}
  - {at: begin, action: Inject, args: g0.org 27}
  - {at: begin, action: Inject, args: g0.org 47}
  - {at: begin, action: Inject, args: g0.org 67}
  - {at: begin, action: Inject, args: g1.org 32}
  - {at: begin, action: Inject, args: g1.org 52}
  - {at: begin, action: Inject, args: g1.org 72}
  - {at: begin, action: Inject, args: g1.org 33}
  - {at: begin, action: Inject, args: g1.org 53}
  - {at: begin, action: Inject, args: g1.org 73}
  - {at: begin, action: Inject, args: g1.org 34}
  - {at: begin, action: Inject, args: g1.org 74}
  - {at: begin, action: Inject, args: g1.org 35}
  - {at: begin, action: Inject, args: g1.org 75}
  - {at: begin, action: Inject, args: g1.org 36}
  - {at: begin, action: Inject, args: g1.org 56}
  - {at: begin, action: Inject, args: g1.org 76}
  - {at: begin, action: Inject, args: g1.org 37}
  - {at: begin, action: Inject, args: g1.org 57}
  - {at: begin, action: Inject, args: g1.org 77}
  - {at: begin, action: Inject, args: g2.org 44}
  - {at: begin, action: Inject, args: g3.org 45}
  - {at: begin, action: Inject, args: g4.org 54}
  - {at: begin, action: Inject, args: g5.org 55}
  - {at: 0, every: 1, until: end, action: PrintCountData}
  - {at: 0, every: 1, until: end, action: PrintTasksData}
  - {at: 0, every: 1, until: end, action: PrintReactionData}
  - {at: 0, every: 5, until: end, action: PrintAverageData}
  - {at: 0, every: 5, until: end, action: PrintPredatorAverageData}
  - {at: 0, every: 5, until: end, action: PrintPreyAverageData}
  - {at: 0, every: 5, until: end, action: PrintTargets}
  - {at: 0, every: 5, until: end, action: PrintAttacks}
  - {at: 0, every: 5, until: end, action: PrintKilledPreyFTData}
  - {at: 0, every: 5, until: end, action: PrintGroupAttackData, args: group_attacks.dat instset}
  - {at: 0, every: 5, until: end, action: PrintCellData}
  - {at: 0, every: 10, until: end, action: DumpTargetGrid}
  - {at: 3, action: Exit}
