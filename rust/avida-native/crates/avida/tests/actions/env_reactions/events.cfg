u begin Inject default-classic.org
u 0:10:60 PrintResourceData
u 0:20:60 PrintCountData
u 0:20:60 PrintReactionData
u 60 Exit
u 10 SetReactionValue NOT 2.5
u 15 SetReactionValueMult NAND 0.5
u 20 SetReactionMaxTaskCount ORN 3
u 25 SetReactionTask AND orn
u 30 SetEnvironmentRandomMask 255
u 35 SetConfig COPY_MUT_PROB 0.02
u 40 ChangeEnvironment REACTION AND and process:value=3.0:type=pow
u 45 SetSeasonalResource ResGlobal
