# Top-navigation trace of one organism with avatars: printed at its first reproduction, flushed again (cycle -1), then a new queue over the grown population.
u begin Inject anc.org 210
u begin PrintTopNavTrace
u 0:10:end PrintCountData
u 30 FlushTopNavTrace
u 40 PrintNavTrace
u 60 FlushTopNavTrace
u 80 Exit
