RESOURCE food:initial=5000:inflow=50:outflow=0.01
GRADIENT_RESOURCE den:height=8:spread=8:plateau=1:decay=1:min_x=0:max_x=5:min_y=0:max_y=5:move_a_scaler=1:updatestep=10000:peakx=2:peaky=2:habitat=4:threshold=0.5
GRADIENT_RESOURCE food2:height=4:spread=4:plateau=2:decay=1:min_x=0:max_x=5:min_y=0:max_y=5:move_a_scaler=1:updatestep=10000:peakx=4:peaky=4:habitat=0:threshold=1
REACTION ECHO echo process:value=600.0:type=energy requisite:max_count=3
REACTION eat0 eat-target:target_id=0 process:resource=food:value=0.5:type=add:min=1:max=1:depletable=1
REACTION eat1 eat-target:target_id=1 process:resource=food:value=0.5:type=add:min=1:max=1:depletable=1
REACTION eat2 eat-target:target_id=2 process:resource=food:value=0.5:type=add:min=1:max=1:depletable=1
REACTION NOT not process:value=500.0:type=energy requisite:max_count=4
REACTION NAND nand process:value=700.0:type=energy requisite:max_count=4
