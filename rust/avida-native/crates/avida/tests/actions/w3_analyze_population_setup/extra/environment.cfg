##############################################################################
#
# This is the setup file for the task/resource system.  From here, you can
# setup the available resources (including their inflow and outflow rates) as
# well as the reactions that the organisms can trigger by performing tasks.
#
# This file is currently setup to reward 9 tasks, all of which use the
# "infinite" resource, which is undepletable.
#
# For information on how to use this file, see:  doc/environment.html
# For other sample environments, see:  source/support/config/ 
#
##############################################################################

REACTION  NOT  not   process:value=1.0:type=pow  requisite:max_count=1
REACTION  NAND nand  process:value=1.0:type=pow  requisite:max_count=1
REACTION  AND  and   process:value=2.0:type=pow  requisite:max_count=1
REACTION  ORN  orn   process:value=2.0:type=pow  requisite:max_count=1
REACTION  OR   or    process:value=3.0:type=pow  requisite:max_count=1
REACTION  ANDN andn  process:value=3.0:type=pow  requisite:max_count=1
REACTION  NOR  nor   process:value=4.0:type=pow  requisite:max_count=1
REACTION  XOR  xor   process:value=4.0:type=pow  requisite:max_count=1
REACTION  EQU  equ   process:value=5.0:type=pow  requisite:max_count=1
RESOURCE resA:initial=100:inflow=1:outflow=.01
RESOURCE resD:deme=true:initial=100:inflow=1:outflow=.01:geometry=grid:inflowx1=1:inflowx2=3:inflowy1=1:inflowy2=2
RESOURCE resB:initial=50:geometry=torus:inflow=2:outflow=.1:xdiffuse=0.5
GRADIENT_RESOURCE food0:height=5:spread=12:plateau=1:decay=5:move_a_scaler=1:updatestep=200:halo=1:halo_inner_radius=2:halo_anchor_x=5:halo_anchor_y=5:halo_width=12
GRADIENT_RESOURCE food1:height=3:spread=10:plateau=1:decay=1:move_a_scaler=3.8:max_x=10:min_x=2:max_y=9:min_y=1:plateau_inflow=0.01
