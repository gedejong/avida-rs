# Avida experiment file, converted with 'avida convert' from
# avida.cfg, instset.cfg, environment.cfg, events.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.
general:
  random_seed: 10
world:
  x: 6
  y: 6
mutation:
  copy_prob: 0.0
  divide_ins_prob: 0.0
  divide_del_prob: 0.0
reproduction:
  allow_parent: 0
  death_method: 0
  age_limit: 0
  juvenile_period: 10
  reset_inputs_on_divide: 1
time:
  ave_time_slice: 10
  slicing_method: 0
  base_merit_method: 0
  merit_inc_apply_immediate: 1
altruism:
  max_donates: 1000
hoarding:
  use_resource_bins: 1
  absorb_resource_fraction: 0.01
  multi_absorb_type: 1
  return_stored_on_death: 0
  split_on_divide: 0
movement:
  track_birth_locs: 1
sensing:
  look_dist: 50
groups:
  use_form_groups: 1
  pred_prey_switch: 1
  pred_efficiency: 0.37
  pred_efficiency_poison: 0.21
  pred_odds: 0.6
  pred_injury: 0.13
  max_prey_bt: 6
  track_group_attack_details: 1

instruction_sets:
  - name: instset
    hardware_type: 3
    instructions:
      - nop-A
      - nop-B
      - nop-C
      - nop-D
      - nop-E
      - nop-F
      - nop-G
      - nop-H
      - zero
      - inc
      - dec
      - repro
      - input
      - output
      - rotate-right-one
      - rotate-x
      - move
      - set-forage-target
      - set-rand-p-ft-once
      - get-loc-org-density
      - get-faced-org-density
      - collect-edible
      - nop2-collect-edible
      - collect-specific
      - donate-specific
      - set-guard
      - get-num-guards
      - get-num-juvs
      - get-res-stored

environment:
  resources:
    - {name: food, initial: 5000, inflow: 50, outflow: 0.01}
    - name: den
      kind: gradient
      height: 8
      spread: 8
      plateau: 1
      decay: 1
      min_x: 0
      max_x: 5
      min_y: 0
      max_y: 5
      move_a_scaler: 1
      updatestep: 10000
      peakx: 2
      peaky: 2
      habitat: 4
      threshold: 0.5
    - name: food2
      kind: gradient
      height: 4
      spread: 4
      plateau: 2
      decay: 1
      min_x: 0
      max_x: 5
      min_y: 0
      max_y: 5
      move_a_scaler: 1
      updatestep: 10000
      peakx: 4
      peaky: 4
      habitat: 0
      threshold: 1
  reactions:
    - {name: ECHO, task: echo, process: {value: 1.0, type: add}, requisite: {max_count: 3}}
    - name: eat0
      task: eat-target
      args: {target_id: 0}
      process: {resource: food, value: 0.5, type: add, min: 1, max: 1, depletable: 1}
    - name: eat1
      task: eat-target
      args: {target_id: 1}
      process: {resource: food, value: 0.5, type: add, min: 1, max: 1, depletable: 1}
    - name: eat2
      task: eat-target
      args: {target_id: 2}
      process: {resource: food, value: 0.5, type: add, min: 1, max: 1, depletable: 1}

events:
  - {at: begin, action: LoadMiniTraceQ, args: file=gq.txt:orgs_per=3}
  - {at: begin, action: Inject, args: r.org 22}
  - {at: begin, action: Inject, args: r.org 33}
  - {at: begin, action: Inject, args: r.org 8}
  - {at: begin, action: Inject, args: p.org 14}
  - {at: begin, action: Inject, args: p.org 15}
  - {at: 0, every: 1, until: end, action: PrintCountData}
  - {at: 0, every: 1, until: end, action: PrintAverageData}
  - {at: 0, every: 1, until: end, action: PrintPredatorAverageData}
  - {at: 0, every: 1, until: end, action: PrintPreyAverageData}
  - {at: 0, every: 1, until: end, action: PrintTargets}
  - {at: 0, every: 20, until: end, action: DumpTargetGrid}
  - {at: 0, every: 40, until: end, action: SavePopulation}
  - {at: 80, action: Exit}
