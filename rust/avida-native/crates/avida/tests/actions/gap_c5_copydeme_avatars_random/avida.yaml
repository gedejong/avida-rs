events:
  - {at: begin, action: InjectRange, args: blank-repro.org 0 36}
  - {at: 0, every: 1, until: end, action: PrintCountData}
  - {at: 0, every: 5, until: end, action: PrintAverageData}
  - {at: 0, every: 5, until: end, action: PrintPreyAverageData}
  - {at: 0, every: 5, until: end, action: DumpTargetGrid}
  - {at: 0, every: 5, until: end, action: PrintCellData}
  - {at: 6, action: CopyDeme, args: 0 1}
  - {at: 12, action: CopyDeme, args: 1 0}
  - {at: 18, action: CopyDeme, args: 0 1}
  - {at: 24, action: Exit}
