# Avida experiment file, converted with 'avida convert' from
# avida.cfg, instset.cfg, environment.cfg, events.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.
general:
  random_seed: 10
world:
  geometry: 1
mutation:
  copy_prob: 0.0
  divide_prob: 0.25
reproduction:
  birth_method: 4
  allow_parent: 0
  death_method: 1
  age_limit: 18000
  reset_inputs_on_divide: 1
divide:
  required_bonus: 2.0
time:
  base_merit_method: 0
hoarding:
  absorb_resource_fraction: 1.0
  multi_absorb_type: 1
  return_stored_on_death: 0
  split_on_divide: 0
movement:
  use_avatars: 2
  avatar_birth: 2
sensing:
  look_dist: 50
groups:
  pred_prey_switch: 0

instruction_sets:
  - name: instset
    hardware_type: 3
    instructions:
      - nop-A
      - nop-B
      - nop-C
      - nop-D
      - nop-E
      - nop-F
      - nop-G
      - nop-H
      - if-n-equ
      - if-less
      - mov-head
      - jmp-head
      - get-head
      - set-flow
      - search-seq-comp-s
      - search-seq-direct-s
      - label
      - shift-r
      - shift-l
      - inc
      - dec
      - push
      - pop
      - swap-stk
      - swap
      - pop-all
      - push-all
      - add
      - sub
      - nand
      - fork-thread
      - exit-thread
      - id-thread
      - IO
      - {name: repro, cost: 30}
      - wait-cond-equ
      - wait-cond-less
      - wait-cond-gtr
      - if-not-0
      - if-equ-0
      - if-gtr-0
      - if-less-0
      - if-gtr-x
      - if-equ-x
      - {name: move, post_cost: 30}
      - get-north-offset
      - rotate-x
      - rotate-org-id
      - rotate-away-org-id
      - set-ft-once
      - get-forage-target
      - look-around
      - attack-ft-prey
      - attack-pred
      - teach-offspring
      - learn-parent
      - nop-X
      - scramble-registers
      - zero

