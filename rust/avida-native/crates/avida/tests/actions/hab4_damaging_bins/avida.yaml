# Avida experiment file, converted with 'avida convert' from
# avida.cfg, environment.cfg, events.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.
general:
  random_seed: 101

instruction_sets:
  - name: heads_default
    hardware_type: 0
    instructions:
      - nop-A
      - nop-B
      - nop-C
      - if-n-equ
      - if-less
      - pop
      - push
      - swap-stk
      - swap
      - shift-r
      - shift-l
      - inc
      - dec
      - add
      - sub
      - nand
      - IO
      - h-alloc
      - h-divide
      - h-copy
      - h-search
      - mov-head
      - jmp-head
      - get-head
      - if-label
      - set-flow

environment:
  resources:
    - name: bad0
      kind: gradient
      height: 8
      spread: 15
      plateau: 2
      decay: 1
      move_a_scaler: 3.8
      max_x: 75
      min_x: 50
      max_y: 75
      min_y: 50
      damage: 0.25
      threshold: 1

events:
  - {at: begin, action: InjectRange, args: nop.org 5000 7000}
  - {at: 0, every: 4, until: end, action: PrintAverageData}
  - {at: 0, every: 4, until: end, action: PrintCountData}
  - {at: 0, every: 60, until: end, action: PrintResourceData}
  - {at: 120, action: Exit}
