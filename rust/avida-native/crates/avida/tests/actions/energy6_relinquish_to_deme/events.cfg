# relinquishEnergyToOrganismsInDeme: a dying organism's stored energy becomes testament for every organism of its deme.
# The test CPU run at each injection adds to the testament statistics too, as it does in the C++.
u begin Inject echo40.org 0
u begin Inject echo40.org 150
u 8 Inject relinq.org 45
u 12 Inject relinq.org 160
u 15 Inject relinq.org 77
u 0:5:end PrintDemeTestamentStats
u 0:10:end PrintCountData
u 0:10:end PrintAverageData
u 40 Exit
