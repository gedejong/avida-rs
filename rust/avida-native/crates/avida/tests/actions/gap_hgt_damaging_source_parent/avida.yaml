# Avida experiment file, converted with 'avida convert' from
# avida.cfg, environment.cfg, events.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.
general:
  random_seed: 101

instruction_sets:
  - name: heads_default
    hardware_type: 0
    instructions:
      - nop-A
      - nop-B
      - nop-C
      - if-n-equ
      - if-less
      - pop
      - push
      - swap-stk
      - swap
      - shift-r
      - shift-l
      - inc
      - dec
      - add
      - sub
      - nand
      - IO
      - h-alloc
      - h-divide
      - h-copy
      - h-search
      - mov-head
      - jmp-head
      - get-head
      - if-label
      - set-flow

environment:
  resources:
    - {name: frag, hgt: 1, inflowx1: -99}
    - name: bad0
      kind: gradient
      height: 10
      spread: 10
      plateau: 8
      decay: 1
      move_a_scaler: 3.8
      max_x: 12
      min_x: 8
      max_y: 12
      min_y: 8
      damage: 0.05
      threshold: 1
  reactions:
    - {name: NOT, task: not, process: {resource: frag, value: 1.0, type: pow}}
    - {name: NAND, task: nand, process: {value: 1.0, type: pow}, requisite: {max_count: 1}}
    - {name: AND, task: and, process: {value: 2.0, type: pow}, requisite: {max_count: 1}}

events:
  - {at: begin, action: Inject, args: default-classic.org}
  - {at: 0, every: 10, until: end, action: PrintAverageData}
  - {at: 0, every: 10, until: end, action: PrintCountData}
  - {at: 0, every: 10, until: end, action: PrintTasksData}
  - {at: 0, every: 10, until: end, action: PrintResourceData}
  - {at: 0, every: 10, until: end, action: PrintHGTData}
  - {at: 0, every: 50, until: end, action: PrintDominantGenotype}
  - {at: 300, action: SavePopulation}
  - {at: 300, action: Exit}
