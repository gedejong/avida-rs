# Avida experiment file, converted with 'avida convert' from
# avida.cfg, environment.cfg, events.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.
general:
  random_seed: 101

instruction_sets:
  - name: heads_default
    hardware_type: 0
    instructions:
      - nop-A
      - nop-B
      - nop-C
      - if-n-equ
      - if-less
      - pop
      - push
      - swap-stk
      - swap
      - shift-r
      - shift-l
      - inc
      - dec
      - add
      - sub
      - nand
      - IO
      - h-alloc
      - h-divide
      - h-copy
      - h-search
      - mov-head
      - jmp-head
      - get-head
      - if-label
      - set-flow

environment:
  reactions:
    - name: NOT
      task: not
      process: {value: 1.0, type: pow, phenplastbonus: nobonus}
      requisite: {max_count: 1}
    - name: NAND
      task: nand
      process: {value: 1.0, type: pow, phenplastbonus: fullbonus}
      requisite: {max_count: 1}
    - name: AND
      task: and
      process: {value: 2.0, type: pow, phenplastbonus: fracbonus}
      requisite: {max_count: 1, divide_only: 2}
    - {name: ORN, task: orn, process: {value: 2.0, type: pow}, requisite: {max_count: 1}}
    - name: OR
      task: or
      process: {value: 3.0, type: pow, phenplastbonus: nobonus}
      requisite: {max_count: 1}

events:
  - {at: begin, action: Inject, args: plastic.org}
  - {at: 0, every: 10, until: end, action: PrintAverageData}
  - {at: 0, every: 10, until: end, action: PrintCountData}
  - {at: 0, every: 10, until: end, action: PrintTasksData}
  - {at: 0, every: 10, until: end, action: PrintTasksExeData}
  - {at: 50, every: 50, until: end, action: PrintTaskProbHistogram}
  - {at: 250, action: Exit}
