# Avida experiment file, converted with 'avida convert' from
# avida.cfg, environment.cfg, events.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.
general:
  random_seed: 101

instruction_sets:
  - name: heads_default
    hardware_type: 0
    instructions:
      - nop-A
      - nop-B
      - nop-C
      - if-n-equ
      - if-less
      - pop
      - push
      - swap-stk
      - swap
      - shift-r
      - shift-l
      - inc
      - dec
      - add
      - sub
      - nand
      - IO
      - h-alloc
      - h-divide
      - h-copy
      - h-search
      - mov-head
      - jmp-head
      - get-head
      - if-label
      - set-flow

environment:
  reactions:
    - {name: NOT, task: not, process: {value: 1.0, type: pow}, requisite: {max_count: 1}}
    - {name: NAND, task: nand, process: {value: 1.0, type: pow}, requisite: {max_count: 1}}
    - {name: AND, task: and, process: {value: 2.0, type: pow}, requisite: {max_count: 1}}
    - {name: ORN, task: orn, process: {value: 2.0, type: pow}, requisite: {max_count: 1}}
    - {name: OR, task: or, process: {value: 3.0, type: pow}, requisite: {max_count: 1}}
    - {name: ANDN, task: andn, process: {value: 3.0, type: pow}, requisite: {max_count: 1}}
    - {name: NOR, task: nor, process: {value: 4.0, type: pow}, requisite: {max_count: 1}}
    - {name: XOR, task: xor, process: {value: 4.0, type: pow}, requisite: {max_count: 1}}
    - {name: EQU, task: equ, process: {value: 5.0, type: pow}, requisite: {max_count: 1}}

events:
  - {at: begin, action: Inject, args: default-classic.org}
  - {at: 0, every: 10, until: 60, action: PrintCountData}
  - {at: 60, action: SavePopulation}
  - {at: 60, action: Exit}
  - {at: 1, action: SeverGridCol, args: 6}
  - {at: 1, action: SeverGridRow, args: 6 0 8}
  - {at: 1, action: ConnectCells, args: 0 0 10 10}
  - {at: 1, action: DisconnectCells, args: 0 0 1 0}
  - {at: 10, action: SetMutProb, args: COPY_MUT 0.05}
  - {at: 20, action: ModMutProb, args: DIV_INS 0.05 0 70}
  - {at: 30, action: SwapCells, args: 0 50}
  - {at: 40, action: SwapRandomCells, args: 10}
  - {at: 45, action: JoinGridCol, args: 6}
  - {at: 50, action: SetProbFail, args: nop-C 0.1}
