# Avida experiment file, converted with 'avida convert' from
# avida.cfg, instset-heads.cfg, environment.cfg, events.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.
general:
  random_seed: 0
world:
  x: 10
  y: 1000
  geometry: 1
demes:
  count: 100
  organism_placement: 1
  organism_facing: 1
  max_age: 40

instruction_sets:
  - name: instset-heads.cfg
    hardware_type: 0
    instructions:
      - nop-A
      - nop-B
      - nop-C
      - if-n-equ
      - if-less
      - pop
      - push
      - swap-stk
      - swap
      - shift-r
      - shift-l
      - inc
      - dec
      - add
      - sub
      - nand
      - IO
      - h-alloc
      - h-divide
      - h-copy
      - h-search
      - mov-head
      - jmp-head
      - get-head
      - if-label
      - set-flow

environment:
  reactions:
    - {name: NOT, task: not, process: {value: 1.0, type: pow}, requisite: {max_count: 1}}
    - {name: NAND, task: nand, process: {value: 1.0, type: pow}, requisite: {max_count: 1}}
    - {name: AND, task: and, process: {value: 2.0, type: pow}, requisite: {max_count: 1}}
    - {name: ORN, task: orn, process: {value: 2.0, type: pow}, requisite: {max_count: 1}}
    - {name: OR, task: or, process: {value: 3.0, type: pow}, requisite: {max_count: 1}}
    - {name: ANDN, task: andn, process: {value: 3.0, type: pow}, requisite: {max_count: 1}}
    - {name: NOR, task: nor, process: {value: 4.0, type: pow}, requisite: {max_count: 1}}
    - {name: XOR, task: xor, process: {value: 4.0, type: pow}, requisite: {max_count: 1}}
    - {name: EQU, task: equ, process: {value: 5.0, type: pow}, requisite: {max_count: 1}}

events:
  - {trigger: immediate, action: InjectDemes, args: default-classic.org}
  - {at: 1, every: 1, until: end, action: ReplicateDemes, args: deme-age}
  - {at: 0, every: 20, until: 40, action: PrintDemeTreatableReplicationData}
  - {at: 0, every: 20, until: 40, action: PrintDemeTreatableCount}
  - {at: 0, every: 20, until: 40, action: PrintPerDemeGenPerFounderData}
  - {at: 0, every: 20, until: 40, action: PrintDemeTestamentStats}
  - {at: 0, every: 20, until: 40, action: PrintCurrentMeanDemeDensity}
  - {at: 0, every: 20, until: 40, action: PrintNumOrgsInDeme}
  - {at: 30, action: SaveDemeFounders}
  - {at: 0, every: 20, until: 40, action: PrintDemesMeritsData}
  - {at: 0, every: 20, until: 40, action: PrintDemeOrgTasksData}
  - {at: 0, every: 20, until: 40, action: PrintDemeCurrentTaskExeData}
  - {at: 0, every: 20, until: 40, action: PrintPerDemeTasksData}
  - {at: 0, every: 20, until: 40, action: PrintDemesTasksData}
  - {at: 41, action: Exit}
