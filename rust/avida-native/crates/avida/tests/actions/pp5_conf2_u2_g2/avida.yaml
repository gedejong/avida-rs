  - {at: 0, every: 1, until: end, action: PrintCountData}
  - {at: 0, every: 1, until: end, action: PrintTasksData}
  - {at: 0, every: 1, until: end, action: PrintReactionData}
  - {at: 0, every: 5, until: end, action: PrintAverageData}
  - {at: 0, every: 5, until: end, action: PrintPredatorAverageData}
  - {at: 0, every: 5, until: end, action: PrintPreyAverageData}
  - {at: 0, every: 5, until: end, action: PrintTargets}
  - {at: 0, every: 5, until: end, action: PrintAttacks}
  - {at: 0, every: 5, until: end, action: PrintKilledPreyFTData}
  - {at: 0, every: 5, until: end, action: PrintGroupAttackData, args: group_attacks.dat instset}
  - {at: 0, every: 5, until: end, action: PrintCellData}
  - {at: 0, every: 10, until: end, action: DumpTargetGrid}
  - {at: 15, action: Exit}
