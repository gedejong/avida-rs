# Avida experiment file, converted with 'avida convert' from
# avida.cfg, instset.cfg, environment.cfg, events.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.
general:
  random_seed: 10
world:
  x: 1
  y: 10
mutation:
  copy_prob: 0.0
  divide_ins_prob: 0.0
  divide_del_prob: 0.0
reproduction:
  allow_parent: false
  death_method: 0
  age_limit: 0
  reset_inputs_on_divide: 1
time:
  base_merit_method: 0
  merit_inc_apply_immediate: true
hoarding:
  use_resource_bins: true
  absorb_resource_fraction: 1.0
  multi_absorb_type: 1
  return_stored_on_death: false
  split_on_divide: false
movement:
  use_avatars: 2
  track_birth_locs: true
sensing:
  look_dist: 50
groups:
  use_form_groups: 1
  pred_prey_switch: 1
  pred_efficiency: 0.37
  pred_efficiency_poison: 0.21
  pred_odds: 0.6
  pred_injury: 0.13
  track_group_attack_details: 1

instruction_sets:
  - name: instset
    hardware_type: 5
    instructions:
      - nop-A
      - nop-B
      - nop-C
      - nop-D
      - nop-E
      - nop-F
      - nop-G
      - nop-H
      - nop-I
      - nop-J
      - nop-K
      - nop-L
      - zero
      - inc
      - dec
      - set-forage-target
      - input
      - output
      - collect-specific
      - rotate-x
      - attack-prey
      - get-faced-org-id
      - attack-ft-prey

environment:
  resources:
    - {name: food, initial: 5000, inflow: 50, outflow: 0.01}
  reactions:
    - {name: ECHO, task: echo, process: {value: 1.0, type: add}, requisite: {max_count: 3}}
    - name: eat0
      task: eat-target
      args: {target_id: 0}
      process: {resource: food, value: 0.5, type: add, min: 1, max: 1, depletable: 1}
    - name: eat1
      task: eat-target
      args: {target_id: 1}
      process: {resource: food, value: 0.5, type: add, min: 1, max: 1, depletable: 1}
    - name: eat2
      task: eat-target
      args: {target_id: 2}
      process: {resource: food, value: 0.5, type: add, min: 1, max: 1, depletable: 1}

events:
  - {at: begin, action: Inject, args: g0.org 0}
  - {at: begin, action: Inject, args: g0.org 4}
  - {at: begin, action: Inject, args: g0.org 8}
  - {at: begin, action: Inject, args: g1.org 2}
  - {at: begin, action: Inject, args: g1.org 6}
  - {at: begin, action: Inject, args: g2.org 1}
  - {at: begin, action: Inject, args: g2.org 5}
  - {at: begin, action: Inject, args: g2.org 9}
  - {at: begin, action: Inject, args: g3.org 3}
  - {at: begin, action: Inject, args: g3.org 7}
  - {at: 0, every: 1, until: end, action: PrintCountData}
  - {at: 0, every: 1, until: end, action: PrintTasksData}
  - {at: 0, every: 1, until: end, action: PrintReactionData}
  - {at: 0, every: 5, until: end, action: PrintAverageData}
  - {at: 0, every: 5, until: end, action: PrintPredatorAverageData}
  - {at: 0, every: 5, until: end, action: PrintPreyAverageData}
  - {at: 0, every: 5, until: end, action: PrintTargets}
  - {at: 0, every: 5, until: end, action: PrintAttacks}
  - {at: 0, every: 5, until: end, action: PrintKilledPreyFTData}
  - {at: 0, every: 5, until: end, action: PrintGroupAttackData, args: group_attacks.dat instset}
  - {at: 0, every: 5, until: end, action: PrintCellData}
  - {at: 0, every: 5, until: end, action: DumpTargetGrid}
  - {at: 40, action: Exit}
