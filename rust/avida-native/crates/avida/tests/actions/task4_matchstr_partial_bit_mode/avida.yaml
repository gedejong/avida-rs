# Avida experiment file, converted with 'avida convert' from
# avida.cfg, environment.cfg, events.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.
general:
  random_seed: 101

instruction_sets:
  - name: heads_default
    hardware_type: 0
    instructions:
      - nop-A
      - nop-B
      - nop-C
      - if-n-equ
      - if-less
      - pop
      - push
      - swap-stk
      - swap
      - shift-r
      - shift-l
      - inc
      - dec
      - add
      - sub
      - nand
      - IO
      - h-alloc
      - h-divide
      - h-copy
      - h-search
      - mov-head
      - jmp-head
      - get-head
      - if-label
      - set-flow

environment:
  reactions:
    - {name: NOT, task: not, process: {value: 1.0, type: pow}}
    - name: MATCH
      task: matchstr
      args: {string: 0000, binary: 0, partial: 1}
      process: {value: 1.0, type: pow}

events:
  - {at: begin, action: InjectRange, args: io.org 0 225}
  - {at: 0, every: 10, until: end, action: PrintAverageData}
  - {at: 0, every: 10, until: end, action: PrintCountData}
  - {at: 0, every: 10, until: end, action: PrintTasksData}
  - {at: 0, every: 10, until: end, action: PrintTasksQualData}
  - {at: 200, action: Exit}
