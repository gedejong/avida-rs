# Avida experiment file, converted with 'avida convert' from
# avida.cfg, instset-heads.cfg, environment-all-logic.cfg, events.cfg.
# A setting left out keeps its default; docs/reference/config-yaml.md lists them all.
general:
  verbosity: 4
  random_seed: 0
world:
  x: 20
  y: 50
mutation:
  copy_prob: 0.0
  divide_ins_prob: 0.0
  divide_del_prob: 0.0
  rate_source: 2
demes:
  migration_file: migration.mat
  count: 10
  migration_method: 4

instruction_sets:
  - name: instset-heads.cfg
    hardware_type: 0
    instructions:
      - nop-A
      - nop-B
      - nop-C
      - if-n-equ
      - if-less
      - pop
      - push
      - swap-stk
      - swap
      - shift-r
      - shift-l
      - inc
      - dec
      - add
      - sub
      - nand
      - IO
      - h-alloc
      - h-divide
      - h-copy
      - h-search
      - mov-head
      - jmp-head
      - get-head
      - if-label
      - set-flow

environment:
  reactions:
    - {name: NOT, task: not, process: {value: 0.2, type: pow}, requisite: {max_count: 1}}
    - {name: NAND, task: nand, process: {value: 0.2, type: pow}, requisite: {max_count: 1}}
    - {name: AND, task: and, process: {value: 0.4, type: pow}, requisite: {max_count: 1}}
    - {name: ORN, task: orn, process: {value: 0.4, type: pow}, requisite: {max_count: 1}}
    - {name: OR, task: or, process: {value: 0.6, type: pow}, requisite: {max_count: 1}}
    - {name: ANDN, task: andn, process: {value: 0.6, type: pow}, requisite: {max_count: 1}}
    - {name: NOR, task: nor, process: {value: 0.8, type: pow}, requisite: {max_count: 1}}
    - {name: XOR, task: xor, process: {value: 0.8, type: pow}, requisite: {max_count: 1}}
    - {name: EQU, task: equ, process: {value: 1.0, type: pow}, requisite: {max_count: 1}}
