# Global resources for the resource-sensing and collection instructions
# (hardware crate differential traces); levels are read through the test
# CPU's initial resource counts.
RESOURCE res0:initial=150
RESOURCE pheromone:initial=120.4
RESOURCE res2:initial=0.75
RESOURCE res3:initial=0

REACTION  NOT  not   process:value=1.0:type=pow:resource=res0:min=100  requisite:max_count=1
REACTION  NAND nand  process:value=1.0:type=pow:resource=res2:min=1    requisite:max_count=1
REACTION  AND  and   process:value=2.0:type=pow  requisite:max_count=1
REACTION  ORN  orn   process:value=2.0:type=pow  requisite:max_count=1
REACTION  OR   or    process:value=3.0:type=pow  requisite:max_count=1
REACTION  ANDN andn  process:value=3.0:type=pow  requisite:max_count=1
REACTION  NOR  nor   process:value=4.0:type=pow  requisite:max_count=1
REACTION  XOR  xor   process:value=4.0:type=pow  requisite:max_count=1
REACTION  EQU  equ   process:value=5.0:type=pow  requisite:max_count=1

# A state grid for the sg-* instructions.
GRID sg1:width=4:height=3:initx=1:inity=2:initfacing=2:states=a,b=5,c=-2:grid=a,b,c,a,b,b,c,a,a,c,b,b
