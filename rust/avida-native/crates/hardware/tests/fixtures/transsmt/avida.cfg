VERSION_ID 2.12.0

# The TransSMT settings of avida-core/tests/set_random_seed/config that
# differ from the defaults (MAX_CPU_THREADS 1 instead of 2: a second thread
# of an uninfected organism makes the reference segfault, see
# transsmt_trace.rs), and REQUIRE_SINGLE_REACTION 0 so that copying
# genomes can divide.
RANDOM_SEED 0
WORLD_X 50
WORLD_Y 50
HARDWARE_TYPE 2
COPY_MUT_PROB 0.0
DIV_MUT_PROB 0.000703
DIV_INS_PROB 0.00003906
DIV_DEL_PROB 0.00003906
DIVIDE_INS_PROB 0.0
DIVIDE_DEL_PROB 0.0
INJECT_INS_PROB 0.000825
INJECT_DEL_PROB 0.000825
INJECT_MUT_PROB 0.0075
META_COPY_MUT 0.2
META_STD_DEV 0.1
BIRTH_METHOD 4
PREFER_EMPTY 0
AGE_LIMIT 30
INHERIT_MERIT 0
REQUIRE_SINGLE_REACTION 0
INJECT_METHOD 1
PARASITE_VIRULENCE 0.85
PARASITE_NO_COPY_MUT 1
MERIT_INC_APPLY_IMMEDIATE 1
MAX_CPU_THREADS 1

EVENT_FILE events.cfg
ENVIRONMENT_FILE environment.cfg

INST_SET_LOAD_LEGACY 0

INSTSET transsmt:hw_type=2
INST Nop-A
INST Nop-B
INST Nop-C
INST Nop-D
INST Val-Shift-R
INST Val-Shift-L
INST Val-Nand
INST Val-Add
INST Val-Sub
INST Val-Mult
INST Val-Div
INST Val-Mod
INST Val-Inc
INST Val-Dec
INST SetMemory
INST Divide
INST Inst-Read
INST Inst-Write
INST If-Equal
INST If-Not-Equal
INST If-Less
INST If-Greater
INST Head-Push
INST Head-Pop
INST Head-Move
INST Search
INST Push-Next
INST Push-Prev
INST Push-Comp
INST Val-Delete
INST Val-Copy
INST IO
INST Inject
INST Divide-Erase
INST Nop-X
INST Thread-Create
INST Thread-Cancel
INST Thread-Kill
INST Rotate-Left
INST Rotate-Right
INST Call-Flow
INST Call-Label
INST Return
INST If-Greater-Equal
INST Divide-Sex-Erase
INST Divide-Sex
INST Divide-Asex-Wait
INST Collect-Unit
