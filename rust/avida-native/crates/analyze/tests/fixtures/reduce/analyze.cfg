VERBOSE
LOAD data/detail-5000.pop
LOAD data/historic-50000.pop
DUPLICATE 0 1
DUPLICATE 0 2
DUPLICATE 0 3
DUPLICATE 0 4
DUPLICATE 0 5
DUPLICATE 0 6
DUPLICATE 0 7
SET_BATCH 1
FILTER num_cpus > 5
DETAIL red-filter.dat id num_cpus length
SET_BATCH 2
SAMPLE_ORGANISMS 0.1
DETAIL red-sample-org.dat id num_cpus
SET_BATCH 3
SAMPLE_GENOTYPES 0.05
DETAIL red-sample-gen.dat id num_cpus
SET_BATCH 4
KEEP_TOP 7
DETAIL red-top.dat id num_cpus
SET_BATCH 5
FIND_CLADE 508717
DETAIL red-clade.dat id parent_id
SET_BATCH 6
FIND_GENOTYPE 508717 num_cpus total_cpus fitness
DETAIL red-org.dat id num_cpus
SET_BATCH 7
FIND_LINEAGE
FIND_LAST_COMMON_ANCESTOR
DETAIL red-lca.dat id parent_id depth
SET_BATCH 0
HISTOGRAM red-hist.dat length depth
HISTOGRAM red-hist.html length
DETAIL_TIMELINE red-timeline.dat 1000 5000 id num_cpus
DETAIL_BATCHES num_cpus red-batches.dat
DETAIL_AVERAGE red-avg.dat num_cpus length depth
DETAIL_INDEX red-index.dat 1 6 id num_cpus
PRINT_TASKS red-tasks.dat
STATUS
